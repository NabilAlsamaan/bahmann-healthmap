services:
  db:
    image: mysql:8
    container_name: bahmann-healthmap-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MySQL2026!
      MYSQL_DATABASE: bewerbungsaufgabe_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bahmann-healthmap-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db

  frontend:
    build: .
    container_name: bahmann-healthmap-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: